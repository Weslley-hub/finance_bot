services:
  postgres:
    image: postgres:16-alpine
    container_name: finlar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finlar
      POSTGRES_PASSWORD: finlar
      POSTGRES_DB: finlar
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finlar -d finlar']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finlar-api
    restart: unless-stopped
    ports:
      - '3001:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finlar:finlar@postgres:5432/finlar?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
